/* ==========================================================================

:root {

}

    --bg: var(--color-bg-primary);
    --surface: var(--color-surface-card);

    --surface-3: #612731;
    --fill: rgba(229, 168, 83, 0.12);
    --fill-strong: rgba(229, 168, 83, 0.22);
    --separator: rgba(201, 134, 59, 0.25);
    --separator-strong: rgba(201, 134, 59, 0.4);
    --text: var(--color-text-primary);
    --text-2: var(--color-text-muted);
    --text-3: rgba(253, 243, 231, 0.55);
    --accent: var(--color-accent-gold);
    --accent-fill: var(--color-accent-saffron);
    --danger: #ff5252;
    --success: #4caf50;
    --switch-off: rgba(82, 33, 41, 0.7);
    --btn-primary-bg: var(--color-accent-gold);
    --btn-primary-hover: #f0be72;
    --btn-primary-fg: var(--color-bg-primary);
    --header-bg: rgba(59, 20, 26, 0.85);
    --glass: rgba(82, 33, 41, 0.82);
    --menu-bg: var(--color-surface-card);
    --glass-border: rgba(201, 134, 59, 0.2);
    --sheet-bg: rgba(59, 20, 26, 0.95);
    --sheet-group: rgba(82, 33, 41, 0.7);

    --flip-card: var(--color-surface-card);
    --flip-digit: var(--color-text-primary);
    --flip-fold: var(--color-accent-saffron);
    --flip-card-top: #481d24;
    --flip-shade: rgba(0, 0, 0, .45);
    --flip-inner: rgba(253, 243, 231, .06);
    --flip-edge: rgba(201, 134, 59, .3);
    --flip-highlight: rgba(229, 168, 83, .2);

/* Settings Sheet */

.input { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid transparent; background: var(--surface-2); color: var(--text); font-size: 16px; }

.row-button { display: flex; align-items: center; gap: 10px; width: 100%; color: var(--accent); font-size: 16px; text-align: left; }

.look-swatch > span { position: relative; display: grid; place-items: center; width: 40%; aspect-ratio: .82; border-radius: 7px; background: var(--flip-card); color: var(--flip-digit); font-family: var(--font-display); font-size: 16px; font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,0.3); }

/* Modal Alarma */
.modal-overlay { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 24px; background: rgba(0,0,0,0.6); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); opacity: 0; transition: opacity .3s ease; }
.modal-overlay.visible { opacity: 1; }

.modal-icon { display: grid; place-items: center; width: 64px; height: 64px; margin-bottom: 8px; border-radius: 50%; background: rgba(229, 168, 83, 0.2); color: var(--accent); animation: alarm-ring 1.2s ease-in-out infinite; }

.modal-actions .btn { width: 100%; }

/* Flip Clock Container */

.card { position: relative; flex-shrink: 0; width: var(--card-w); height: var(--card-h); border-radius: var(--card-r); background: var(--flip-card); box-shadow: var(--flip-shadow); isolation: isolate; }
.card:after { content: ""; position: absolute; inset: 0; z-index: 5; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--flip-edge), inset 0 1px 0 var(--flip-highlight); pointer-events: none; }

.flip-top, .flip-panel-top { top: 0; border-radius: var(--card-r) var(--card-r) 0 0; background: var(--flip-card-top, var(--flip-card)); }

.flip-panel-bottom { z-index: 1; transform-origin: 50% 0; }
.flip-panel:after { content: ""; position: absolute; inset: 0; background: var(--flip-shade); opacity: 0; pointer-events: none; }
.flip-text { position: absolute; left: 0; width: 100%; height: var(--card-h); font-family: var(--font-display); font-size: var(--digit-size); font-weight: 600; line-height: var(--card-h); font-variant-numeric: tabular-nums; color: var(--flip-digit); text-align: center; user-select: none; }
.flip-top .flip-text, .flip-panel-top .flip-text { top: 0; }

.flip-panel-top.flip-a { animation: flip-fall var(--flip-duration) linear forwards; }
.flip-panel-top.flip-b { animation: flip-fall-b var(--flip-duration) linear forwards; }

.flip-panel-bottom.flip-a:after { animation: flip-dim-land var(--flip-duration) linear forwards; }

@keyframes flip-fall { 0% { transform: rotateX(0); animation-timing-function: cubic-bezier(.5,0,.85,.45); } 48%, to { transform: rotateX(-90.5deg); } }
@keyframes flip-fall-b { 0% { transform: rotateX(0); animation-timing-function: cubic-bezier(.5,0,.85,.45); } 48%, to { transform: rotateX(-90.5deg); } }

<script>
(function() {
  'use strict';

  // Lógica de tarjetas Flip
  const FLIP_MS = { simple: 400, standard: 500 };

  function createFlipUnit(id) {
    const get = (part) => document.getElementById(`${id}-${part}`);
    const top = get('top-text'), bottom = get('bottom-text');
    const flapTop = get('flip-top'), flapBottom = get('flip-bottom');
    const flapTopText = get('flip-top-text'), flapBottomText = get('flip-bottom-text');
    const parts = [flapTop, flapBottom].filter(Boolean);
    let current = null;
    let settleTimer = null;
    let phase = 'flip-b';

    const clear = () => parts.forEach(el => el.classList.remove('flip-a', 'flip-b'));

    function flip(from, to) {
      const look = document.body.dataset.look || 'simple';
      const ms = FLIP_MS[look] || 400;
      clearTimeout(settleTimer);
      clear();
      top.textContent = to;
      bottom.textContent = flapTopText.textContent = from;
      flapBottomText.textContent = to;
      phase = phase === 'flip-a' ? 'flip-b' : 'flip-a';
      parts.forEach(el => el.classList.add(phase));
      settleTimer = setTimeout(() => {
        bottom.textContent = to;
        clear();
      }, ms + 20);
    }

    return {
      set(value, animate = true) {
        value = String(value).padStart(2, '0');
        if (!top || value === current) return;
        const previous = current;
        current = value;
        if (previous === null || !animate || document.hidden) {
          clearTimeout(settleTimer);
          clear();
          top.textContent = bottom.textContent = flapTopText.textContent = flapBottomText.textContent = value;
          return;
        }
        flip(previous, value);
      }
    };
  }

  // Motor de Audio Offline Web Audio API
  const SOUND_DEFS = {
    classic: { cycle: 1.6, notes: [0, .16, .32, .48].map(e => ({ at: e, freq: 1760, dur: .09, type: 'square', gain: .22 })) },
    beacon: { cycle: 1.4, notes: [0, .5].map(e => ({ at: e, freq: 660, to: 1320, dur: .38, type: 'sine', gain: .6 })) },
    sunrise: { cycle: 2.6, notes: [523.25, 659.25, 783.99, 1046.5].map((e, a) => ({ at: a * .24, freq: e, dur: .7, type: 'triangle', gain: .4 })) },
    digital: { cycle: 1.0, notes: [{at:0, freq:1200, dur:.08, type:'square', gain:.2}, {at:.12, freq:900, dur:.08, type:'square', gain:.2}] },
    chime: { cycle: 2.2, notes: [{at:0, freq:784, dur:.5, type:'sine', gain:.35}, {at:.15, freq:988, dur:.5, type:'sine', gain:.3}] }
  };

  let audioCtx = null;
  let currentPlayer = null;
  const bufferCache = {};
  let currentSound = 'classic';

  function getAudioCtx() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      try { audioCtx = new Ctx(); } catch { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
  }

  function renderPattern(def) {
    const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ctx = getAudioCtx();
    if (!Offline || !ctx) return null;
    const offline = new Offline(1, Math.ceil(def.cycle * ctx.sampleRate), ctx.sampleRate);

    for (const note of def.notes) {
      const osc = offline.createOscillator();
      const gain = offline.createGain();
      osc.type = note.type || 'sine';
      osc.frequency.setValueAtTime(note.freq, note.at);
      if (note.to) osc.frequency.exponentialRampToValueAtTime(note.to, note.at + note.dur);
      gain.gain.setValueAtTime(1e-4, note.at);
      gain.gain.linearRampToValueAtTime(note.gain, note.at + 0.012);
      gain.gain.exponentialRampToValueAtTime(1e-4, note.at + note.dur);
      osc.connect(gain).connect(offline.destination);
      osc.start(note.at);
      osc.stop(note.at + note.dur + 0.02);
    }
    return offline.startRendering();
  }

  async function getBuffer(name) {
    if (bufferCache[name]) return bufferCache[name];
    const def = SOUND_DEFS[name];
    if (!def) return null;
    try { bufferCache[name] = await renderPattern(def); } catch(e) {}
    return bufferCache[name] || null;
  }

  function stopSound() {
    if (currentPlayer) {
      try { currentPlayer.stop(); } catch {}
      currentPlayer = null;
    }
  }

  async function playSound({ sound = currentSound, volume = 0.8, loop = false, preview = false } = {}) {
    stopSound();
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state !== 'running') await ctx.resume().catch(() => {});
    const buffer = await getBuffer(sound);
    if (!buffer) return;

    const now = ctx.currentTime;
    const gainNode = ctx.createGain();
    gainNode.gain.setValueAtTime(volume, now);
    gainNode.connect(ctx.destination);

    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = loop || !!SOUND_DEFS[sound];
    source.connect(gainNode);
    source.start(now);

    const duration = preview ? 2 : (loop ? 600 : 6);
    source.stop(now + duration);
    currentPlayer = { stop() { try { source.stop(); } catch {} } };
  }

  document.addEventListener('pointerdown', () => getAudioCtx(), { once: true });

  // Control Temporizador
  const hoursUnit = createFlipUnit('timer-hours');
  const minutesUnit = createFlipUnit('timer-minutes');
  const secondsUnit = createFlipUnit('timer-seconds');

  let totalSeconds = 300;
  let remaining = 300;
  let running = false;
  let paused = false;
  let endTime = 0;
  let rafId = null;
  let soundEnabled = true;
  let soundVolume = 0.8;

  const progressBar = document.getElementById('timer-progress-bar');
  const display = document.getElementById('timer-display');
  const startBtn = document.getElementById('timer-start-pause-btn');
  const resetBtn = document.getElementById('timer-reset-btn');
  const hoursInput = document.getElementById('timer-hours-input');
  const minutesInput = document.getElementById('timer-minutes-input');
  const secondsInput = document.getElementById('timer-seconds-input');
  const ringOverlay = document.getElementById('ring-overlay');
  const ringTime = document.getElementById('ring-time');

  function pad(n) { return String(n).padStart(2, '0'); }

  function updateDisplay(secs, animate = true) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    hoursUnit.set(pad(h), animate);
    minutesUnit.set(pad(m), animate);
    secondsUnit.set(pad(s), animate);
    if (progressBar && totalSeconds > 0) {
      const pct = 1 - (secs / totalSeconds);
      progressBar.style.transform = `scaleX(${Math.min(1, Math.max(0, pct))})`;
    }
  }

  function setTimeFromInputs() {
    const h = Math.max(0, Math.min(99, parseInt(hoursInput.value) || 0));
    const m = Math.max(0, Math.min(59, parseInt(minutesInput.value) || 0));
    const s = Math.max(0, Math.min(59, parseInt(secondsInput.value) || 0));
    totalSeconds = h * 3600 + m * 60 + s;
    remaining = totalSeconds;
    updateDisplay(remaining, false);
    document.querySelectorAll('.preset-button').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.seconds) === totalSeconds);
    });
  }

  function setButtonState(state) {
    startBtn.querySelectorAll('.btn-labels > span').forEach(span => {
      span.classList.toggle('on', span.dataset.label === state);
    });
    const icon = document.getElementById('start-icon');
    if (icon) {
      icon.innerHTML = state === 'pause' 
        ? '<path d="M534-220v-520h206v520zm-314 0v-520h207v520zm359-45h116v-430H579zm-314 0h116v-430H265z"/>'
        : '<path d="M340-238v-488l383 244zm45-83 254-161-254-161z"/>';
    }
  }

  function tick() {
    if (!running) return;
    remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
    updateDisplay(remaining, true);
    if (remaining <= 0) {
      finish();
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    if (remaining <= 0) setTimeFromInputs();
    if (remaining <= 0) return;
    running = true;
    paused = false;
    endTime = Date.now() + remaining * 1000;
    document.body.classList.add('timer-running');
    setButtonState('pause');
    [hoursInput, minutesInput, secondsInput].forEach(i => i.disabled = true);
    document.querySelectorAll('.preset-button').forEach(b => b.disabled = true);
    rafId = requestAnimationFrame(tick);
  }

  function pause() {
    running = false;
    paused = true;
    if (rafId) cancelAnimationFrame(rafId);
    remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
    setButtonState('resume');
  }

  function resume() {
    if (remaining <= 0) return;
    running = true;
    paused = false;
    endTime = Date.now() + remaining * 1000;
    setButtonState('pause');
    rafId = requestAnimationFrame(tick);
  }

  function reset() {
    running = false;
    paused = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopSound();
    remaining = totalSeconds;
    updateDisplay(remaining, false);
    document.body.classList.remove('timer-running');
    display.classList.remove('is-finished');
    setButtonState('start');
    [hoursInput, minutesInput, secondsInput].forEach(i => i.disabled = false);
    document.querySelectorAll('.preset-button').forEach(b => b.disabled = false);
    progressBar.style.transform = 'scaleX(0)';
  }

  function finish() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    remaining = 0;
    updateDisplay(0, true);
    document.body.classList.remove('timer-running');
    setButtonState('start');
    [hoursInput, minutesInput, secondsInput].forEach(i => i.disabled = false);
    document.querySelectorAll('.preset-button').forEach(b => b.disabled = false);

    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    ringTime.textContent = h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    ringOverlay.hidden = false;
    requestAnimationFrame(() => ringOverlay.classList.add('visible'));

    if (soundEnabled) playSound({ sound: currentSound, volume: soundVolume, loop: true });
  }

  function closeRing() {
    stopSound();
    ringOverlay.classList.remove('visible');
    setTimeout(() => { ringOverlay.hidden = true; }, 300);
  }

  startBtn.addEventListener('click', () => {
    if (!running && !paused) start();
    else if (running) pause();
    else resume();
  });
  resetBtn.addEventListener('click', reset);

  document.querySelectorAll('.preset-button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (running) return;
      const secs = parseInt(btn.dataset.seconds);
      totalSeconds = remaining = secs;
      hoursInput.value = Math.floor(secs / 3600);
      minutesInput.value = Math.floor((secs % 3600) / 60);
      secondsInput.value = secs % 60;
      updateDisplay(secs, false);
      document.querySelectorAll('.preset-button').forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  [hoursInput, minutesInput, secondsInput].forEach(input => {
    input.addEventListener('change', () => { if (!running) setTimeFromInputs(); });
    input.addEventListener('input', () => { if (!running) setTimeFromInputs(); });
  });

  document.getElementById('ring-ok').addEventListener('click', closeRing);
  document.getElementById('ring-secondary').addEventListener('click', () => { closeRing(); reset(); });

  // Configuración Sheet & UI
  const settingsPanel = document.getElementById('settings-panel');
  const settingsScrim = document.getElementById('settings-scrim');

  function setSettingsOpen(open) {
    settingsPanel.classList.toggle('open', open);
    settingsPanel.inert = !open;
    document.body.classList.toggle('settings-open', open);
    document.body.classList.toggle('popup-active', open);
  }

  document.getElementById('settings-toggle').addEventListener('click', () => setSettingsOpen(true));
  document.getElementById('close-settings').addEventListener('click', () => setSettingsOpen(false));
  settingsScrim.addEventListener('click', () => setSettingsOpen(false));

  document.querySelectorAll('.look-option').forEach(opt => {
    opt.addEventListener('click', () => {
      const look = opt.dataset.look;
      document.body.dataset.look = look;
      document.querySelectorAll('.look-option').forEach(o => o.setAttribute('aria-checked', o.dataset.look === look));
    });
  });

  const soundToggle = document.getElementById('timer-sound-toggle');
  const soundSelect = document.getElementById('timer-sound-select');
  const volumeSlider = document.getElementById('timer-volume');
  const volumeValue = document.getElementById('timer-volume-value');

  function paintRange(range) {
    const pct = ((range.value - range.min) / (range.max - range.min)) * 100;
    range.style.setProperty('--fill-pct', pct + '%');
  }

  soundToggle.addEventListener('change', () => { soundEnabled = soundToggle.checked; });
  soundSelect.addEventListener('change', () => { currentSound = soundSelect.value; });
  volumeSlider.addEventListener('input', () => {
    soundVolume = volumeSlider.value / 100;
    volumeValue.textContent = volumeSlider.value + '%';
    paintRange(volumeSlider);
  });
  document.getElementById('timer-test-sound').addEventListener('click', () => playSound({ sound: currentSound, volume: soundVolume, preview: true }));

  // Pantalla Completa
  const fsBtn = document.getElementById('fullscreen-btn');
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', () => {
    document.body.classList.toggle('fullscreen-active', !!document.fullscreenElement);
  });

  paintRange(volumeSlider);
  updateDisplay(remaining, false);
  document.querySelector('.preset-button[data-seconds="300"]')?.classList.add('active');
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then((reg) => console.log('SW registrado:', reg.scope))
    .catch((err) => console.error('SW falló:', err));
}
</script>
